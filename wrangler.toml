name = "nxt-ads"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "nxt-ads"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
NXT_PLATFORM_FEE_BPS = "1200"
APP_NAME = "NXT ADS"

# Add production credentials with:
